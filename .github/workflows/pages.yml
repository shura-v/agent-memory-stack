name: Publish documentation

on:
  push:
    branches: [main]
    paths:
      - docs/index.html
      - docs/architecture/*.html
      - docs/images/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out documentation
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0

      - name: Prepare static site
        run: |
          mkdir -p _site/architecture _site/images
          cp docs/index.html _site/index.html
          cp docs/architecture/stack.html docs/architecture/mcp.html _site/architecture/
          cp docs/images/agent-memory-stack-overview.png docs/images/agent-memory-stack-setup.gif _site/images/

      - name: Upload site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
